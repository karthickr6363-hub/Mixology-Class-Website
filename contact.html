<!DOCTYPE html>
<html lang="en" x-data="themeRoot()" :class="{ 'dark': darkMode }">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Mixology Masterclass</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="components.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#C5A059', dark: '#A68546' },
                        background: { light: '#FFFFFF', dark: '#0A0A0A' }
                    }
                }
            }
        }
    </script>

    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-sans transition-colors duration-300">

    <div id="nav-container"></div>

    <main class="pt-32 pb-24 px-4 overflow-hidden">
        <div class="max-w-7xl mx-auto">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-start">
                <!-- Rule 38: Align items start for consistent top edge -->
                <!-- Contact Info -->
                <div class="space-y-12">
                    <div>
                        <h1 class="text-4xl md:text-6xl font-serif font-bold mb-6">Let's <span
                                class="italic text-primary">Connect.</span></h1>
                        <p class="text-slate-500 mb-12 max-w-md">Whether you're booking a corporate event or have a
                            question about our classes, our team is here to help.</p>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-8">
                        <div>
                            <h4 class="font-bold text-sm uppercase tracking-widest text-slate-400 mb-4">Our Studio</h4>
                            <p class="text-lg">123 Bartender Way<br>SoHo, New York, NY 10012</p>
                        </div>
                        <div>
                            <h4 class="font-bold text-sm uppercase tracking-widest text-slate-400 mb-4">Direct Lines
                            </h4>
                            <p class="text-lg">+1 (212) 555-0198<br>hello@mixology.com</p>
                        </div>
                    </div>

                    <div class="h-80 rounded-3xl overflow-hidden shadow-xl grayscale hover:grayscale-0 transition-all">
                        <!-- Mock Map -->
                        <div class="w-full h-full bg-slate-200 flex items-center justify-center dark:bg-slate-800">
                            <div class="text-center">
                                <i data-lucide="map-pin" class="w-10 h-10 text-primary mx-auto mb-2"></i>
                                <span class="font-bold">Virtual Map View</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Form Card -->
                <div
                    class="bg-white dark:bg-slate-900 rounded-[2.5rem] p-8 md:p-12 shadow-2xl border border-slate-100 dark:border-slate-800 self-stretch flex flex-col justify-center">
                    <!-- Rule 38/39: self-stretch and flex justify-center to align ends -->
                    <h3 class="text-2xl font-bold mb-8">Send an Inquiry</h3>
                    <form class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-[10px] font-bold text-slate-400 mb-2 uppercase">Full
                                    Name</label>
                                <input type="text" placeholder="Jane Doe"
                                    class="w-full px-6 py-4 rounded-xl bg-slate-50 dark:bg-slate-800 outline-none focus:ring-2 focus:ring-primary transition-all">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-slate-400 mb-2 uppercase">Email</label>
                                <input type="email" placeholder="jane@example.com"
                                    class="w-full px-6 py-4 rounded-xl bg-slate-50 dark:bg-slate-800 outline-none focus:ring-2 focus:ring-primary transition-all">
                            </div>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 mb-2 uppercase">Project
                                Type</label>
                            <select
                                class="w-full px-6 py-4 rounded-xl bg-slate-50 dark:bg-slate-800 outline-none focus:ring-2 focus:ring-primary transition-all appearance-none cursor-pointer">
                                <option>General Inquiry</option>
                                <option>Corporate Event</option>
                                <option>Private Group</option>
                                <option>Media/Press</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 mb-2 uppercase">Message</label>
                            <textarea rows="4" placeholder="Tell us more about your event..."
                                class="w-full px-6 py-4 rounded-xl bg-slate-50 dark:bg-slate-800 outline-none focus:ring-2 focus:ring-primary transition-all"></textarea>
                        </div>
                        <button
                            class="w-full py-4 bg-primary text-white rounded-xl font-bold hover:bg-primary-dark transition-all shadow-xl shadow-primary/20">SEND
                            MESSAGE</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script>
        function themeRoot() {
            return {
                darkMode: localStorage.getItem('darkMode') === 'true',
                toggleDarkMode() {
                    this.darkMode = !this.darkMode;
                    localStorage.setItem('darkMode', this.darkMode);
                    lucide.createIcons();
                },
                init() { lucide.createIcons(); }
            }
        }
    </script>
</body>

</html>
