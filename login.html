<!DOCTYPE html>
<html lang="en" x-data="themeRoot()" :class="{ 'dark': darkMode }">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Mixology Masterclass</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#C5A059', dark: '#A68546' },
                        background: { light: '#F9FAFB', dark: '#0A0A0A' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] }
                }
            }
        }
    </script>

    <style>
        [x-cloak] {
            display: none !important;
        }

        body {
            overflow-y: auto;
        }

        /* Allow scrolling if content exceeds viewport */

        /* Rule 19: No scrollbar */
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-sans transition-colors duration-300 min-h-screen flex items-center justify-center p-4">

    <!-- Login Card (Rule 20, 21) -->
    <div
        class="w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl shadow-2xl p-8 md:p-12 border border-slate-100 dark:border-slate-800">
        <!-- Logo Centered (Rule 21, 22) -->
        <div class="text-center mb-10">
            <a href="index.html" class="inline-flex flex-col items-center gap-2 group">
                <img src="favicon.svg" alt="Mixology Logo" class="w-16 h-16 group-hover:scale-110 transition-transform">
                <span
                    class="text-2xl font-serif font-bold tracking-tight text-slate-900 dark:text-white">MIXOLOGY</span>
            </a>
            <h2 class="text-xl font-bold mt-6 text-slate-500">Welcome Back</h2>
        </div>

        <form class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-slate-400 mb-2 uppercase tracking-widest">Email
                    Address</label>
                <input type="email" placeholder="bar@example.com"
                    class="w-full px-6 py-4 rounded-xl bg-slate-50 dark:bg-slate-800 border-none focus:ring-2 focus:ring-primary outline-none transition-all">
            </div>
            <div>
                <label
                    class="block text-sm font-bold text-slate-400 mb-2 uppercase tracking-widest flex justify-between">
                    <span>Password</span>
                    <a href="#" class="text-primary normal-case tracking-normal">Forgot?</a>
                </label>
                <input type="password" placeholder="••••••••"
                    class="w-full px-6 py-4 rounded-xl bg-slate-50 dark:bg-slate-800 border-none focus:ring-2 focus:ring-primary outline-none transition-all">
            </div>

            <button type="submit"
                class="w-full py-4 bg-primary text-white rounded-xl font-bold text-lg hover:bg-primary-dark transition-all shadow-xl shadow-primary/20">
                SIGN IN
            </button>
        </form>

        <!-- Social Login (Rule 28) -->
        <div class="mt-8">
            <div class="relative mb-8">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-slate-100 dark:border-slate-800"></div>
                </div>
                <div class="relative flex justify-center text-sm"><span
                        class="px-4 bg-white dark:bg-slate-900 text-slate-400">OR CONTINUE WITH</span></div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button
                    class="flex items-center justify-center gap-3 py-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 transition-all">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5">
                    <span class="text-sm font-bold">Google</span>
                </button>
                <button
                    class="flex items-center justify-center gap-3 py-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 transition-all">
                    <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" class="w-5 h-5">
                    <span class="text-sm font-bold">Facebook</span>
                </button>
            </div>
        </div>

        <p class="text-center mt-10 text-slate-500 text-sm">
            Don't have an account? <a href="signup.html" class="text-primary font-bold hover:underline">Create
                Account</a>
        </p>
    </div>

    <!-- Toggle Theme (Discrete) -->
    <button @click="toggleDarkMode()"
        class="fixed bottom-8 right-8 p-3 rounded-full bg-slate-100 dark:bg-slate-800 shadow-lg">
        <i data-lucide="moon" x-show="!darkMode" class="w-5 h-5"></i>
        <i data-lucide="sun" x-show="darkMode" class="w-5 h-5"></i>
    </button>

    <script>
        function themeRoot() {
            return {
                darkMode: localStorage.getItem('darkMode') === 'true',
                toggleDarkMode() {
                    this.darkMode = !this.darkMode;
                    localStorage.setItem('darkMode', this.darkMode);
                    lucide.createIcons();
                },
                init() { lucide.createIcons(); }
            }
        }
    </script>
</body>

</html>
